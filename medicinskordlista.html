      <noscript>
      <dl class="glossary-noscript">
        <dt>Abdomen</dt><dd>Buk; bukhålan och dess innehåll. Sv: buk, mage. Eng: abdomen. Lekman: magen, buken. Av lat. abdomen, troligen av abdere = gömma undan.</dd>
        <dt>Abduktion</dt><dd>Rörelse bort från kroppens mittlinje. Eng: abduction. Motsats: adduktion. Av lat. ab- (bort) + ducere = leda.</dd>
        <dt>Acetabulum</dt><dd>Höftledsskål i bäckenet; tar emot lårbenshuvudet (caput femoris). Sv: höftledsgrop, höftledspanna, ledpanna. Eng: acetabulum, hip socket. Av lat. acetum (ättika) + -bulum (behållare) = ättikskål; ledpannans form liknar en liten skål.</dd>
        <dt>Acromion (akromion)</dt><dd>Lateralt utskott på skulderbladets ryggrad; bildar skuldertoppen. Sv: akromion. Eng: acromion. Lekman: skuldertoppen. Av grek. akron (spets, topp) + omos = axel.</dd>
        <dt>Adduktion</dt><dd>Rörelse mot kroppens mittlinje. Eng: adduction. Motsats: abduktion. Av lat. ad- (mot) + ducere = leda.</dd>
        <dt>Afferent</dt><dd>Inkommande; leder nervsignaler från periferin till CNS. Eng: afferent. Lekman: inkommande nervsignal. Motsats: efferent. Av lat. ad- (mot) + ferre = bära.</dd>
        <dt>Aktionspotential</dt><dd>Elektrisk impuls längs nervfiber som följer allt-eller-inget-principen. Eng: action potential. Av lat. actio (handling) + potentia = kraft.</dd>
        <dt>Alvéolus (alveol)</dt><dd>Liten urholkning eller luftsäck, t.ex. i lungan där gasutbyte sker. Sv: alveol. Eng: alveolus (pl. alveoli). Lekman: luftsäck, lungblåsa. Av lat. alveolus = liten håla, diminutiv av alveus = ränna, urholkning.</dd>
        <dt>Anatomisk position</dt><dd>Standardläget för anatomiska beskrivningar: kroppen stående upprätt, ansiktet framåt, armarna längs sidan med handflatorna vända framåt. Eng: anatomical position. Av grek. ana- (upp) + temnein = skära; "att skära upp" syftar på dissektionskonsten.</dd>
        <dt>Anterior</dt><dd>På framsidan; mot buken (synonym: ventral). Sv: framåt, ventral. Eng: anterior, ventral. Av lat. anterior = framre, komparativ av ante = före.</dd>
        <dt>Anteversion</dt><dd>Framåttippning av ett organ eller ledhals, t.ex. femurhalsen eller uterus (motsats: retroversion). Eng: anteversion. Av lat. ante (före) + vertere = vända.</dd>
        <dt>Aorta</dt><dd>Kroppens största artär; utgår från vänster hjärtkammare. Eng: aorta. Lekman: stora kroppspulsådern. Av grek. aorte, av aeirein = lyfta, hänga upp.</dd>
        <dt>Arcus</dt><dd>Båge; bågformig anatomisk struktur. Sv: båge. Eng: arch, arcus. Av lat. arcus = båge, pil.</dd>
        <dt>Arteria (artär)</dt><dd>Blodkärl som leder blod bort från hjärtat. Sv: artär. Eng: artery. Lekman: pulsåder. Av grek. arteria, av aer (luft) + terein = hålla; antika greker trodde att artärer innehöll luft.</dd>
        <dt>Articulatio</dt><dd>Led; anatomisk förbindning mellan ben. Sv: led. Eng: joint, articulation. Av lat. articulus = liten led, diminutiv av artus = led, fog.</dd>
        <dt>Atlas (C1)</dt><dd>Första halskotan; bär upp skallen och artikulerar med nackbenet. Eng: atlas. Lekman: nickarkotan. Uppkallat efter titanen Atlas i grekisk mytologi, som bar upp himlavalvet.</dd>
        <dt>Atrium</dt><dd>Förmak; en av hjärtats två övre kamrar. Sv: förmak. Eng: atrium (pl. atria). Lekman: hjärtförmak. Av lat. atrium = förgård, entréhall.</dd>
        <dt>Axis (C2)</dt><dd>Andra halskotan; densutskotet möjliggör rotation av atlas och skallen. Eng: axis. Lekman: vridkotan. Av lat. axis = axel, pivå.</dd>
        <dt>Axilla</dt><dd>Armhåla. Sv: armhåla. Eng: axilla, armpit. Av lat. axilla = armhåla, diminutiv av ala = vinge.</dd>
        <dt>Axon</dt><dd>Nervcellfibern som leder aktionspotentialen bort från cellkroppen. Eng: axon, nerve fiber. Av grek. axon = axel.</dd>
        <dt>Basis</dt><dd>Bas; nedre eller bredaste delen av en anatomisk struktur. Sv: bas. Eng: base, basis. Av grek./lat. basis = grund, steg, fundament.</dd>
        <dt>Biceps</dt><dd>Tvåhövdad muskel (med två ursprung), t.ex. M. biceps brachii i överarmen. Eng: biceps. Av lat. bi- (två) + caput = huvud; "tvåhövdad".</dd>
        <dt>Bilateralis</dt><dd>Bilateral; på båda sidor av kroppen. Sv: bilateral. Eng: bilateral. Av lat. bi- (två) + latus = sida.</dd>
        <dt>Brachium</dt><dd>Överarm. Sv: överarm. Eng: arm, brachium. Av lat./grek. brachion = arm.</dd>
        <dt>Brevis</dt><dd>Kort. Sv: kort. Eng: short, brevis. Av lat. brevis = kort.</dd>
        <dt>Bukläge (prone)</dt><dd>Liggande på magen med ansiktet nedåt; används vid undersökning av rygg och vid intensivvård. Sv: magläge. Eng: prone position. Av lat. pronus = framåtlutad, liggande på magen.</dd>
        <dt>Calcaneus</dt><dd>Hälben; det största tarsalbenet. Sv: hälben; även: kalkaneus. Eng: calcaneus, heel bone. Av lat. calx = häl.</dd>
        <dt>Canalis</dt><dd>Kanal; rörformigt hålrum i ben eller vävnad. Sv: kanal. Eng: canal, channel. Av lat. canalis = kanal, av canna = rör av vass.</dd>
        <dt>Capitulum</dt><dd>Litet huvud; liten avrundad ledyta på ett ben. Eng: capitulum. Lekman: liten ledknöl. Av lat. caput (huvud) + -ulum (diminutiv) = litet huvud.</dd>
        <dt>Caput</dt><dd>Huvud; ledhuvudet som passar in i en ledgrop. Sv: huvud. Eng: head, caput. Av lat. caput = huvud.</dd>
        <dt>Carpus</dt><dd>Handrot; de åtta handrotsbenen och deras region. Sv: handrot. Eng: carpus, wrist. Lekman: handleden (vardaglig). Av grek. karpos = handled, möjligen besläktat med karpos = frukt (skörda).</dd>
        <dt>Caudal (kaudal)</dt><dd>Mot svansen; nedåt i kroppen hos människan (synonym: inferior). Sv: kaudal, nedre. Eng: caudal, inferior. Av lat. cauda = svans.</dd>
        <dt>Cavitas glenoidalis</dt><dd>Ledhålan på scapula där humerus sitter i axelleden. Sv: ledpanna, glenoidpanna. Eng: glenoid cavity, glenoid fossa. Av lat. cavus (ihålig) + grek. glene (ledpanna) + eidos = form.</dd>
        <dt>Central</dt><dd>Mot centrum; i nervsystemet avser det hjärnan och ryggmärgen (CNS). Eng: central. Motsats: perifer. Av lat. centrum, av grek. kentron = mittpunkt.</dd>
        <dt>Cerebellum</dt><dd>Lillhjärna; koordinerar rörelser, balans och finmotorik. Sv: lillhjärnan. Eng: cerebellum. Lekman: lilla hjärnan. Av lat. cerebellum = liten hjärna, diminutiv av cerebrum.</dd>
        <dt>Cerebrum</dt><dd>Storhjärna; ansvarar för medvetande, motorik, sensorik och kognition. Sv: storhjärnan. Eng: cerebrum. Av lat. cerebrum = hjärna.</dd>
        <dt>Cervicalis</dt><dd>Som hör till halsen; cervikala kotor = halskotor (C1–C7). Sv: cervikal. Eng: cervical. Lekman: hals-. Av lat. cervix = hals, nacke.</dd>
        <dt>Cirkumduktion</dt><dd>Cirkulär rörelse i en led; kombinerar flexion, extension, abduktion och adduktion. Eng: circumduction. Av lat. circum (runt) + ducere = leda.</dd>
        <dt>Clavicula</dt><dd>Nyckelben; förbinder sternum med scapula. Sv: nyckelben; även: klavikel. Eng: clavicle, collarbone. Av lat. clavis (nyckel) + -cula (diminutiv) = liten nyckel; benets form liknar en nyckel.</dd>
        <dt>CNS</dt><dd>Centrala nervsystemet; hjärna och ryggmärg. Eng: central nervous system (CNS). Jfr PNS. Av lat. centralis + grek. neuron = nerv.</dd>
        <dt>Collateralis</dt><dd>Löpande bredvid; t.ex. collaterala ligament på sidorna av en led. Sv: kollateral. Eng: collateral. Av lat. col- (med) + latus = sida.</dd>
        <dt>Columna vertebralis</dt><dd>Ryggraden; 33–34 kotor indelade i cervical-, thorakal-, lumbal-, sakral- och coccygealnivå. Sv: ryggrad, kotpelare. Eng: vertebral column, spine, spinal column. Av lat. columna (pelare) + vertebra av vertere = vända.</dd>
        <dt>Condylus</dt><dd>Ledknöl; avrundad knöl på ett ben som bildar del av en led. Sv: kondyl. Eng: condyle. Av grek. kondylos = knoge, knutig utbuktning.</dd>
        <dt>Contralateral</dt><dd>På motsatt sida av kroppen (jfr ipsilateral). Sv: kontralateral. Eng: contralateral. Av lat. contra (mot) + latus = sida.</dd>
        <dt>Cor</dt><dd>Hjärta. Sv: hjärta. Eng: heart. Av lat. cor = hjärta, besläktat med grek. kardia.</dd>
        <dt>Corpus</dt><dd>Kropp; den centrala delen av en struktur. Sv: kropp. Eng: body, corpus. Av lat. corpus = kropp.</dd>
        <dt>Corpus callosum</dt><dd>Hjärnbalken; nervfiberbunt som förbinder vänster och höger hjärnhalva. Sv: hjärnbalk. Eng: corpus callosum. Av lat. corpus (kropp) + callosus = hård, förhårdnad.</dd>
        <dt>Cortex</dt><dd>Bark; yttre lager, t.ex. hjärnbarken (cortex cerebri). Sv: bark, cortex. Eng: cortex. Av lat. cortex = bark, skal.</dd>
        <dt>Costa (costae)</dt><dd>Revben; 12 par revben bildar bröstkorgen. Sv: revben. Eng: rib, costa. Av lat. costa = revben, sida.</dd>
        <dt>Coxa</dt><dd>Höft; coxaleden = höftleden. Sv: höft. Eng: hip, coxa. Av lat. coxa = höft.</dd>
        <dt>Cranial (kranial)</dt><dd>Mot skallen/huvudet (synonym: superior). Sv: kranial, övre. Eng: cranial, superior. Av grek. kranion = skalle.</dd>
        <dt>Cranium (kranium)</dt><dd>Skallen; benskelettstrukturen som omger och skyddar hjärnan. Sv: kranium, skalle. Eng: cranium, skull. Av grek. kranion = skalle.</dd>
        <dt>Crista</dt><dd>List eller kam; upphöjd benrand, t.ex. crista iliaca (höftbensskammen). Sv: list, kam. Eng: crest, ridge. Av lat. crista = kam, topp, tofs.</dd>
        <dt>Cubitus</dt><dd>Armbåge. Sv: armbåge. Eng: elbow, cubitus. Av lat. cubitus = armbåge, av cubare = ligga ned; det man stödjer sig mot när man liggar.</dd>
        <dt>Cutis (dérma)</dt><dd>Hud; kroppens yttre skyddande organ. Sv: hud. Eng: skin, cutis, dermis. Av lat. cutis = hud.</dd>
        <dt>Dendrit</dt><dd>Grenformiga utskott på en nervcell som tar emot inkommande signaler. Sv: dendrit. Eng: dendrite. Av grek. dendron = träd; grenarna liknar trädgrenar.</dd>
        <dt>Depression</dt><dd>Sänkning; nedåtrörelse av en kroppsdel, t.ex. skulderblad. Eng: depression. Motsats: elevation. Av lat. de- (ned) + premere = trycka.</dd>
        <dt>Deviation (radial/ulnar)</dt><dd>Sidoböjning av handleden mot tumsidan (radial deviation) eller lillfingersidan (ulnar deviation). Eng: radial/ulnar deviation. Av lat. de- (av) + via = väg; "avvika från vägen".</dd>
        <dt>Dextrum</dt><dd>Höger (sida). Sv: höger. Eng: right, dexter. Av lat. dexter = höger, skicklig.</dd>
        <dt>Diaphragma</dt><dd>Mellangärdet; kupformad andningsmuskel som separerar bröst- och bukhålan. Sv: mellangärde; även stavat: diafragma. Eng: diaphragm. Lekman: andningsmuskeln. Av grek. dia (tvärs) + phragma = staket, avskiljare.</dd>
        <dt>Diaphysis</dt><dd>Benstammens skaft; mittdelen på ett rörben. Sv: diafys. Eng: diaphysis, shaft. Av grek. dia (mellan) + phyein = växa; "det som växer emellan".</dd>
        <dt>Diastole</dt><dd>Hjärtats avslappnings- och fyllnadsfas. Eng: diastole. Lekman: hjärtats vilofas. Motsats: systole. Av grek. dia (isär) + stellein = sända; "sändas isär, utvidgas".</dd>
        <dt>Digitus</dt><dd>Finger eller tå. Sv: finger, tå. Eng: digit, finger, toe. Av lat. digitus = finger, tå.</dd>
        <dt>Discus</dt><dd>Skiva, t.ex. intervertebral discus (mellankotsskiva) eller discus articularis (ledskiva). Sv: skiva; även stavat: disk. Eng: disc, disk. Lekman: ryggens disk (vid diskbråck). Av grek. diskos = skiva, kastskiva.</dd>
        <dt>Distal</dt><dd>Längre från ursprunget eller kroppens centrum; motsats till proximal. Eng: distal. Av lat. distare = stå isär, befinna sig på avstånd.</dd>
        <dt>Dorsal</dt><dd>Mot baksidan; ovansidan av hand eller fot (synonym: posterior). Sv: dorsal, bakåt. Eng: dorsal, posterior. Av lat. dorsum = rygg.</dd>
        <dt>Dorsalflexion</dt><dd>Fotleden böjs uppåt; foten dras mot underbenet. Sv: dorsalflexion; även: dorsiflexion. Eng: dorsiflexion. Av lat. dorsum (rygg) + flectere = böja.</dd>
        <dt>Efferent</dt><dd>Utgående; leder nervsignaler från CNS till muskler och körtlar. Eng: efferent. Lekman: utgående nervsignal. Motsats: afferent. Av lat. ex- (ut) + ferre = bära.</dd>
        <dt>Elevation</dt><dd>Höjning; uppåtrörelse av en kroppsdel, t.ex. skulderblad. Eng: elevation. Motsats: depression. Av lat. e- (upp) + levare = lyfta.</dd>
        <dt>Encephalon</dt><dd>Hjärna; hela hjärnan inklusive storhjärna, lillhjärna och hjärnstam. Sv: hjärna. Eng: encephalon, brain. Av grek. en (i) + kephale = huvud; "det som finns inuti huvudet".</dd>
        <dt>Epicondylus</dt><dd>Knöl ovanpå condylus; fäste för muskler, t.ex. på humerus vid armbågen. Sv: epikondyl. Eng: epicondyle. Av grek. epi (ovanpå) + kondylos = knoge.</dd>
        <dt>Epiphysis</dt><dd>Benstammens ände; tillväxtzon i unga ben (epifysplatta). Sv: epifys. Eng: epiphysis. Lekman: benstammens ände. Av grek. epi (ovanpå) + phyein = växa; "det som växer ovanpå".</dd>
        <dt>Erytrocyt</dt><dd>Röd blodkropp; transporterar syre med hjälp av hemoglobin. Sv: röd blodkropp. Eng: erythrocyte, red blood cell (RBC). Av grek. erythros (röd) + kytos = cell.</dd>
        <dt>Eversion</dt><dd>Rotation av fotsulan utåt. Eng: eversion. Motsats: inversion. Av lat. ex- (ut) + vertere = vända.</dd>
        <dt>Extension</dt><dd>Sträckning av en led; ökar vinkeln mellan bensegmenten. Eng: extension. Motsats: flexion. Av lat. ex- (ut) + tendere = sträcka.</dd>
        <dt>Extensor</dt><dd>Sträckare; muskel som utför extension. Sv: sträckmuskel. Eng: extensor. Motsats: flexor. Av lat. extendere = sträcka ut.</dd>
        <dt>Externus</dt><dd>Extern; mot utsidan av ett organ eller en struktur (motsats: internus). Sv: yttre. Eng: external. Av lat. externus = yttre, av exter = utanför.</dd>
        <dt>Extremitas</dt><dd>Extremitet; arm eller ben. Sv: extremitet, lem. Eng: extremity, limb. Av lat. extremus = ytterst, längst ut.</dd>
        <dt>Fascia</dt><dd>Bindvävshinna som omger och separerar muskler och organ. Sv: fascia, bindvävshinna. Eng: fascia. Av lat. fascia = band, bindel.</dd>
        <dt>Femur</dt><dd>Lårben; kroppens längsta och starkaste ben. Sv: lårben. Eng: femur, thigh bone. Av lat. femur = lår.</dd>
        <dt>Fibula</dt><dd>Vadben; det smala benet på utsidan av underbenet. Sv: vadben. Eng: fibula. Av lat. fibula = spänne, häftstift; benets smala form liknar ett spänne.</dd>
        <dt>Fibular (peroneal)</dt><dd>På vadbens-/lilltåsidan av underbenet. Sv: fibulär; även kallat: peroneal. Eng: fibular, peroneal. Av lat. fibula = spänne.</dd>
        <dt>Flexion</dt><dd>Böjning av en led; minskar vinkeln mellan bensegmenten. Eng: flexion. Motsats: extension. Av lat. flectere = böja.</dd>
        <dt>Flexor</dt><dd>Böjare; muskel som utför flexion. Sv: böjmuskel. Eng: flexor. Motsats: extensor. Av lat. flectere = böja.</dd>
        <dt>Foramen</dt><dd>Hål eller öppning i ben, t.ex. foramen magnum i nackbenet. Sv: hål, öppning. Eng: foramen (pl. foramina). Av lat. forare = borra, genomborra.</dd>
        <dt>Fossa</dt><dd>Grop eller fördjupning i en benyta. Sv: grop. Eng: fossa (pl. fossae). Av lat. fodere = gräva; fossa = grav, dike.</dd>
        <dt>Fowlerläge</dt><dd>Halvsittande ryggläge med överdelen av kroppen höjd 30–90°; används vid andningssvårigheter och i postoperativ vård. Eng: Fowler's position. Uppkallat efter kirurgen George Ryerson Fowler (1848–1906).</dd>
        <dt>Frontalplan</dt><dd>Vertikalt plan som delar kroppen i en framre och en bakre del. Sv: koronalplan (synonym). Eng: frontal plane, coronal plane. Av lat. frons = panna, framsida.</dd>
        <dt>Genu</dt><dd>Knä. Sv: knä. Eng: knee, genu. Av lat. genu = knä.</dd>
        <dt>Gliacell</dt><dd>Stödjande och skyddande cell i nervsystemet, t.ex. oligodendrocyt och schwanncell. Sv: gliacell. Eng: glial cell, neuroglia, glia. Av grek. glia = lim; stödjande celler "limmar" ihop nervsystemet.</dd>
        <dt>Hemoglobin</dt><dd>Syrebärande protein i de röda blodkropparna (erytrocyterna). Eng: hemoglobin (AmE), haemoglobin (BrE). Förkortning: Hb. Av grek. haima (blod) + lat. globus = klot; "blodklot".</dd>
        <dt>Humerus</dt><dd>Överarmsben; artikulerar med scapula i axelleden och radius/ulna i armbågsleden. Sv: överarmsben. Eng: humerus. Av lat. humerus = axel, överarm.</dd>
        <dt>Hyperextension</dt><dd>Sträckning förbi neutral anatomisk position. Sv: översträckning. Eng: hyperextension. Av grek. hyper (över, utöver) + lat. extendere = sträcka.</dd>
        <dt>Hypotalamus</dt><dd>Hjärnstruktur som reglerar homeostas, hunger, törst och hormonbalans. Sv: hypotalamus. Eng: hypothalamus. Av grek. hypo (under) + thalamos = inre gemak; "under thalamus".</dd>
        <dt>Inferior</dt><dd>Nedre; mot fötterna (synonym: kaudal). Sv: nedre, kaudal. Eng: inferior, caudal. Av lat. inferus = lägre, nedre.</dd>
        <dt>Intermediär</dt><dd>Belägen mellan två strukturer; t.ex. mellersta kilbenet (os cuneiforme intermedium) i foten. Eng: intermediate. Av lat. inter (mellan) + medius = mitt.</dd>
        <dt>Internus</dt><dd>Intern; mot insidan av ett organ eller en struktur (motsats: externus). Sv: inre. Eng: internal. Av lat. internus = inre, av inter = bland.</dd>
        <dt>Inversion</dt><dd>Rotation av fotsulan inåt. Eng: inversion. Motsats: eversion. Av lat. in- + vertere = vända; "vända inåt".</dd>
        <dt>Inåtrotation</dt><dd>Rotation av en extremitet mot kroppens mittlinje. Eng: medial rotation, internal rotation. Motsats: utåtrotation. Av lat. rotare = rotera, av rota = hjul.</dd>
        <dt>Ipsilateral</dt><dd>På samma sida av kroppen (jfr contralateral). Sv: ipsilateral. Eng: ipsilateral. Av lat. ipse (samme, själv) + latus = sida.</dd>
        <dt>Kapillär</dt><dd>Det minsta blodkärlet; gasutbyte sker här mellan blod och vävnad. Sv: kapillär. Eng: capillary. Lekman: hårkärl. Av lat. capillus = hår; capillaris = hårfin.</dd>
        <dt>Lateral</dt><dd>Bort från kroppens mittlinje; mot sidan. Sv: lateral, åt sidan. Eng: lateral. Av lat. latus = sida.</dd>
        <dt>Lateralflexion</dt><dd>Sidorörelse; böjning av ryggraden eller halsen åt sidan. Eng: lateral flexion, lateral bending. Av lat. latus (sida) + flectere = böja.</dd>
        <dt>Leukocyt</dt><dd>Vit blodkropp; ingår i kroppens immunförsvar. Sv: vit blodkropp. Eng: leukocyte, leucocyte, white blood cell (WBC). Av grek. leukos (vit) + kytos = cell.</dd>
        <dt>Ligamentum</dt><dd>Band av tät bindvävnad som förbinder ben med ben. Sv: ligament, ledband. Eng: ligament. Lekman: ledband. Av lat. ligare = binda.</dd>
        <dt>Liquor cerebrospinalis</dt><dd>Ryggmärgsvätska; skyddar och omger hjärna och ryggmärg. Sv: ryggmärgsvätska, cerebrospinalvätska; vardagligen: likvor. Eng: cerebrospinal fluid (CSF). Av lat. liquor (vätska) + cerebrum (hjärna) + spina = ryggrad.</dd>
        <dt>Litotomiläge</dt><dd>Ryggläge med höfterna och knäna böjda och benen hållna uppåt; används vid gynekologiska och urologiska ingrepp. Eng: lithotomy position. Av grek. lithos (sten) + tome = snitt; ursprungsposition vid operation för blåssten.</dd>
        <dt>Lumbalis</dt><dd>Som hör till ländryggen; lumbala kotor = ländkotor (L1–L5). Sv: lumbal. Eng: lumbar. Lekman: ländryggen. Av lat. lumbus = länd.</dd>
        <dt>Luxatio</dt><dd>Urledvridning; dislokation av en led. Sv: luxation, urledvridning. Eng: luxation, dislocation. Av lat. luxare = vrida ur led.</dd>
        <dt>Malleolus</dt><dd>Knöl vid ankeln; medial malleolus på tibia, lateral på fibula. Sv: malleol. Eng: malleolus (pl. malleoli). Lekman: inre/yttre fotknölen. Av lat. malleus (hammare) + -olus (diminutiv) = liten hammare; formen liknar en hammare.</dd>
        <dt>Mandibula</dt><dd>Underkäken. Sv: underkäke. Eng: mandible, lower jaw. Av lat. mandere = tugga; mandibula = käke.</dd>
        <dt>Maxilla</dt><dd>Överkäken. Sv: överkäke. Eng: maxilla, upper jaw. Av lat. maxilla, diminutiv av mala = käke.</dd>
        <dt>Medial</dt><dd>Mot kroppens mittlinje. Sv: medial. Eng: medial. Av lat. medius = mitten.</dd>
        <dt>Medianplan</dt><dd>Sagittalplanet som löper exakt i mitten och delar kroppen i lika höger och vänster halvor. Sv: midsagittalplan (synonym). Eng: median plane, midsagittal plane. Av lat. medianus = i mitten, av medius = mitt.</dd>
        <dt>Medulla</dt><dd>Märg; t.ex. ryggmärgen (medulla spinalis) eller benmärgen. Sv: märg. Eng: medulla, marrow. Av lat. medulla = märg, kärna; innersta delen.</dd>
        <dt>Membrana</dt><dd>Hinna; tunn vävnadshinna. Sv: membran, hinna. Eng: membrane. Av lat. membrum (lem) → membrana = hinna som omger en lem.</dd>
        <dt>Meniscus</dt><dd>Halvmånformig fibrocartilaginös broskskiva, t.ex. i knäleden. Sv: menisk. Eng: meniscus (pl. menisci). Lekman: menisken. Av grek. meniskos = liten månskära, diminutiv av mene = måne.</dd>
        <dt>Musculus (M.)</dt><dd>Muskel. Sv: muskel. Eng: muscle. Av lat. mus (mus) + -culus (diminutiv) = liten mus; rörlig muskel under huden ansågs likna en löpande mus.</dd>
        <dt>Myelin</dt><dd>Fettrik isolationshölje kring axon; ökar signalledningshastigheten. Sv: myelin, myelinskida. Eng: myelin, myelin sheath. Av grek. myelos = märg.</dd>
        <dt>Neuron</dt><dd>Nervcell; består av cellkropp, axon och dendriter. Sv: nervcell. Eng: neuron, nerve cell. Av grek. neuron = nerv, sena.</dd>
        <dt>Nodus Ranvieri</dt><dd>Avbrott i myelinskidan som möjliggör saltatorisk signalledning. Sv: Ranviers nod, Ranviers insnörning. Eng: node of Ranvier. Av lat. nodus = knut; uppkallat efter Louis-Antoine Ranvier (1835–1922).</dd>
        <dt>Obliqt plan</dt><dd>Diagonalt snittsplan som inte sammanfaller med sagittal-, frontal- eller transversalplanet. Sv: oblikt plan. Eng: oblique plane. Av lat. obliquus = sned, diagonal.</dd>
        <dt>Occipitalis</dt><dd>Som hör till nackbenet; occipital = bakhuvudet. Sv: occipital. Eng: occipital. Lekman: nacke, bakhuvud. Av lat. ob- (bakom) + caput = huvud; "bakhuvud".</dd>
        <dt>Olecranon</dt><dd>Armbågsknölen; det bakre utskottet på ulna som bildar armbågen. Sv: olekranon, armbågsutskott. Eng: olecranon. Lekman: armbågsspetsen. Av grek. olene (armbåge) + kranon = huvud, skalle; "armbågens huvud".</dd>
        <dt>Omvänt Trendelenburgläge</dt><dd>Ryggläge med huvud och överkropp höjt och benen sänkta; används t.ex. vid bukkirurgi. Eng: reverse Trendelenburg position. Uppkallat efter Friedrich Trendelenburg (1844–1924), tysk kirurg.</dd>
        <dt>Opposition</dt><dd>Tummen förs mot fingerspetsarna; exklusivt för primaterna. Eng: opposition. Motsats: reposition. Av lat. ob- (mot) + ponere = placera; "ställa mot".</dd>
        <dt>Os (ossa)</dt><dd>Ben/benen; t.ex. os frontale = pannbenet. Sv: ben. Eng: bone, os. Av lat. os (pl. ossa) = ben.</dd>
        <dt>Osteoblast</dt><dd>Bencell som skapar ny benmatrix och bygger upp ben. Eng: osteoblast. Lekman: benbyggande cell. Av grek. osteon (ben) + blastos = grodd; "benbildande groddcell".</dd>
        <dt>Osteoklast</dt><dd>Bencell som bryter ner och resorberar benvävnad. Eng: osteoclast. Lekman: bennedbrytande cell. Av grek. osteon (ben) + klastes = krossare.</dd>
        <dt>Osteocyt</dt><dd>Mogen bencell inuti benvävnaden som underhåller benmatrixen. Eng: osteocyte. Lekman: mogen bencell. Av grek. osteon (ben) + kytos = cell.</dd>
        <dt>Palmar (volar)</dt><dd>Handflatans sida av handen. Sv: palmar, volar. Eng: palmar, volar. Lekman: handflatan. Av lat. palma = handflata.</dd>
        <dt>Parasagittalplan</dt><dd>Sagittalplan parallellt med medianplanet men inte i kroppens mitt. Eng: parasagittal plane. Av grek. para (bredvid) + lat. sagitta = pil.</dd>
        <dt>Parasympaticus</dt><dd>Del av autonoma nervsystemet; aktiv vid vila, matsmältning och återhämtning. Sv: parasympatikus. Eng: parasympathetic nervous system. Lekman: "rest and digest". Av grek. para (bredvid) + syn (med) + pathos = känsla.</dd>
        <dt>Parietal</dt><dd>Parietalyta; mot kroppsväggen (jfr visceral), t.ex. parietal pleura kläder bröstväggens insida. Sv: parietal, väggblad. Eng: parietal. Av lat. paries = vägg.</dd>
        <dt>Patella</dt><dd>Knäskål; ett sesamben i quadriceps-senan framför knäleden. Sv: knäskål. Eng: patella, kneecap. Av lat. patera (skål) + -ella (diminutiv) = liten skål; formen liknar en liten skål.</dd>
        <dt>Perifer</dt><dd>Belägen i utkanten, långt från centrum; i nervsystemet = utanför hjärna och ryggmärg (jfr central). Eng: peripheral. Av grek. peri (runt) + pherein = bära; "det som bärs runt om".</dd>
        <dt>Pes</dt><dd>Fot. Sv: fot. Eng: foot, pes. Av lat. pes = fot.</dd>
        <dt>Phalanges</dt><dd>Finger- och tåben; singularis: phalanx (proximal, medial, distal). Sv: falanger (sg. falang). Eng: phalanges (sg. phalanx). Lekman: fingerknogarna, falangerna. Av grek. phalanx = stridsformation; fingerbenens radade uppställning liknar en falanx.</dd>
        <dt>Plantar</dt><dd>Fotsulans sida av foten. Sv: plantar, fotsula. Eng: plantar. Lekman: undersidan av foten. Av lat. planta = fotsula.</dd>
        <dt>Plantarflexion</dt><dd>Fotleden böjs nedåt; att gå på tå eller peka med foten. Eng: plantar flexion, plantarflexion. Av lat. planta (fotsula) + flectere = böja.</dd>
        <dt>PNS</dt><dd>Perifera nervsystemet; alla nerver utanför hjärna och ryggmärg. Eng: peripheral nervous system (PNS). Jfr CNS. Av grek. peri (runt, utom) + neuron = nerv.</dd>
        <dt>Posterior</dt><dd>På baksidan; mot ryggen (synonym: dorsal). Sv: dorsal, bakåt. Eng: posterior, dorsal. Av lat. posterus = bakre, av post = efter.</dd>
        <dt>Processus</dt><dd>Utskott; framskjutande utsprång från ett ben eller organ. Sv: utskott. Eng: process, processus. Av lat. procedere = gå framåt (pro + cedere = gå).</dd>
        <dt>Profundus</dt><dd>Djup; långt från ytan (motsats: superficialis). Sv: djup. Eng: deep, profundus. Av lat. pro (framåt) + fundus = botten; "ner mot botten".</dd>
        <dt>Pronation</dt><dd>Rotation av underarmen så handflatan vänds nedåt eller bakåt. Eng: pronation. Motsats: supination. Av lat. pronus = framåtlutad, liggande på magen.</dd>
        <dt>Protraktion</dt><dd>Framåtrörelse av en kroppsdel, t.ex. skulderblad eller käke. Eng: protraction. Motsats: retraktion. Av lat. pro (framåt) + trahere = dra.</dd>
        <dt>Protrusion</dt><dd>Framskjutning av en struktur, t.ex. diskprotrusion (utbuktning av mellankotsskiva) eller framåtrörelse av underkäken. Eng: protrusion. Lekman: diskbråck (vid diskprotrusion). Av lat. pro (framåt) + trudere = trycka, driva.</dd>
        <dt>Proximal</dt><dd>Närmare ursprunget eller kroppen; motsats till distal. Eng: proximal. Av lat. proximus = närmast.</dd>
        <dt>Pulmo</dt><dd>Lunga. Sv: lunga. Eng: lung, pulmo. Av lat. pulmo = lunga.</dd>
        <dt>Radial</dt><dd>På strålbenets/tumsidans sida av underarmen och handen. Sv: radial, tumsidan. Eng: radial. Av lat. radius = hjuleker, stråle.</dd>
        <dt>Radius</dt><dd>Strålben; det yttre av underarmens ben, på tumsidan. Sv: strålben. Eng: radius. Av lat. radius = hjuleker, stråle; benets form liknar en eker.</dd>
        <dt>Ramus</dt><dd>Gren; nervgren eller utskott på ett ben. Sv: gren. Eng: ramus (pl. rami), branch. Av lat. ramus = gren.</dd>
        <dt>Reposition</dt><dd>Återgång till neutral position, t.ex. tummen efter opposition. Eng: reposition. Motsats: opposition. Av lat. re- (tillbaka) + ponere = placera.</dd>
        <dt>Retraktion</dt><dd>Bakåtrörelse av en kroppsdel, t.ex. skulderblad eller käke. Eng: retraction. Motsats: protraktion. Av lat. re- (tillbaka) + trahere = dra.</dd>
        <dt>Retroversion</dt><dd>Bakåttippning av ett organ, t.ex. uterus retroversus (motsats: anteversion). Eng: retroversion. Av lat. retro (bakåt) + vertere = vända.</dd>
        <dt>Retrusion</dt><dd>Bakåtrörelse av underkäken (synonym: retraktion av mandibula; motsats: protrusion). Eng: retrusion. Av lat. retro (bakåt) + trudere = trycka.</dd>
        <dt>Rotation</dt><dd>Vridande rörelse av en kroppsdel kring en axel. Eng: rotation. Se även: inåtrotation, utåtrotation. Av lat. rotare = rotera, av rota = hjul.</dd>
        <dt>Ryggläge (supine)</dt><dd>Liggande på rygg med ansiktet uppåt; standardläge vid många undersökningar och operationer. Sv: ryggläge. Eng: supine position. Av lat. supinus = bakåtlutad, liggande på rygg.</dd>
        <dt>Sacrum</dt><dd>Korsbenet; 5 sammanvuxna ryggkotor i bäckenet. Sv: korsben. Eng: sacrum, sacral bone. Av lat. os sacrum = det heliga benet; sacer = helig (troligen offrades detta ben vid religiösa riter).</dd>
        <dt>Sagittalplan</dt><dd>Lodrätt plan som delar kroppen i vänster och höger delar; flexion och extension sker i detta plan. Eng: sagittal plane. Av lat. sagitta = pil; planet löper som en pil framifrån bakåt.</dd>
        <dt>Scapula</dt><dd>Skulderblad; plattben på bröstkorgens baksida. Sv: skulderblad. Eng: scapula, shoulder blade. Av lat. scapula = skulderblad, spade.</dd>
        <dt>Sidoläge</dt><dd>Liggande på sidan; används bl.a. vid återhämtningsläge och vid undersökning. Eng: lateral position, lateral decubitus. Av lat. latus = sida.</dd>
        <dt>Simsläge</dt><dd>Halvt bukläge med överkroppen roterad, en arm framåt och knäna lätt böjda; används t.ex. vid rektalundersökning. Eng: Sims' position. Uppkallat efter gynekolog James Marion Sims (1813–1883).</dd>
        <dt>Sinister</dt><dd>Vänster (sida). Sv: vänster. Eng: left, sinister. Av lat. sinister = vänster; ansågs olycksbådande i romerska augurier.</dd>
        <dt>Sinusknutan (SA-noden)</dt><dd>Hjärtats naturliga pacemaker i höger förmak; initierar hjärtats elektriska impuls. Sv: sinusknuta, SA-knutan. Eng: sinoatrial node (SA node). Av lat. sinus (bukt, kurva) + nodus = knut.</dd>
        <dt>Sternum</dt><dd>Bröstben; plattben i mitten av bröstkorgens framsida. Sv: bröstben. Eng: sternum, breastbone. Av grek. sternon = bröstben, bröstkorg.</dd>
        <dt>Sulcus</dt><dd>Fåra eller ytlig fördjupning, t.ex. på hjärnans yta eller i benvävnad. Sv: fåra. Eng: sulcus (pl. sulci), groove. Av lat. sulcus = plogfåra.</dd>
        <dt>Superficialis</dt><dd>Ytlig; nära ytan (motsats: profundus). Sv: ytlig. Eng: superficial. Av lat. super (ovan) + facies = yta, ansikte; "ytan ovanpå".</dd>
        <dt>Superior</dt><dd>Övre; mot huvudet (synonym: kranial). Sv: övre, kranial. Eng: superior, cranial. Av lat. superus = övre, av super = ovan.</dd>
        <dt>Supination</dt><dd>Rotation av underarmen så handflatan vänds uppåt eller framåt. Eng: supination. Motsats: pronation. Av lat. supinus = liggande på rygg, vänd uppåt.</dd>
        <dt>Sympaticus</dt><dd>Del av autonoma nervsystemet; aktiv vid stress och fysisk aktivitet. Sv: sympatikus. Eng: sympathetic nervous system. Lekman: "fight or flight"-systemet. Av grek. syn (med) + pathos = känsla; "medkänsla, samverkan".</dd>
        <dt>Synaps</dt><dd>Kontaktzonen där nervsignalen överförs kemiskt från ett neuron till nästa cell. Sv: synaps. Eng: synapse. Av grek. syn (tillsammans) + haptein = fästa; myntad av Charles Sherrington 1897.</dd>
        <dt>Synovialis (synovia)</dt><dd>Ledvätska; smörjer, dämpar och ger näring till ledbrosket. Sv: ledvätska. Eng: synovial fluid. Lekman: ledsmörjning. Av grek. syn (med) + oon = ägg; ledvätskan liknar äggvita. Termen myntad av Paracelsus (~1520).</dd>
        <dt>Talus</dt><dd>Språngben; tarsalben som bildar ankelleden med tibia och fibula. Sv: språngben. Eng: talus, ankle bone. Av lat. talus = ankelben; romarnas tärningsspel spelades med knogben.</dd>
        <dt>Tendo (sena)</dt><dd>Bindvävssträngen som förbinder en muskel med ett ben. Sv: sena. Eng: tendon. Av lat. tendere = sträcka.</dd>
        <dt>Thalamus</dt><dd>Relästation i hjärnan för sensorisk information på väg till hjärnbarken. Sv: thalamus. Eng: thalamus. Av grek. thalamos = inre gemak, sovrum.</dd>
        <dt>Thoracalis</dt><dd>Som hör till bröstkorgen; thorakala kotor = bröstkotor (T1–T12). Sv: thorakal. Eng: thoracic. Av grek. thorax = bröstpansar, bröstkorg.</dd>
        <dt>Thorax</dt><dd>Bröstkorg; skelettet av revben, sternum och thorakala kotor. Sv: bröstkorg. Eng: thorax, chest. Av grek. thorax = bröstpansar, bröstkorg.</dd>
        <dt>Tibia</dt><dd>Skenben; det tjocka, viktbärande benet på insidan av underbenet. Sv: skenben. Eng: tibia, shin bone. Av lat. tibia = flöjt, rörpipa; benets cylindriska form liknar ett musikinstrument.</dd>
        <dt>Tibial</dt><dd>På skenbenets/stortåsidan av underbenet. Sv: tibial. Eng: tibial. Av lat. tibia = flöjt, rörpipa.</dd>
        <dt>Transversalplan</dt><dd>Horisontellt plan som delar kroppen i övre och nedre delar; rotation sker i detta plan. Sv: horisontellt plan. Eng: transverse plane, horizontal plane. Av lat. trans (tvärs) + vertere = vända.</dd>
        <dt>Trendelenburgläge</dt><dd>Ryggläge med sänkt huvud och höjda ben; ökar venöst återflöde till hjärtat och används bl.a. vid chock. Eng: Trendelenburg position. Uppkallat efter Friedrich Trendelenburg (1844–1924), tysk kirurg.</dd>
        <dt>Triceps</dt><dd>Trehövdad muskel (med tre ursprung), t.ex. M. triceps brachii i överarmens baksida. Eng: triceps. Av lat. tri- (tre) + caput = huvud; "trehövdad".</dd>
        <dt>Trochanter</dt><dd>Stor knöl på lårbenet; fäste för höftens muskler. Sv: trokanter. Eng: trochanter. Lekman: höftknölen (trochanter major = större trokanter; trochanter minor = mindre trokanter). Av grek. trokhazein = löpa, springa; musklerna här möjliggör löpning.</dd>
        <dt>Tuber</dt><dd>Utbuktning eller knöl på ett ben. Sv: tuber, knöl. Eng: tuber; liten knöl: tuberculum (eng. tubercle). Av lat. tuber = svullnad, knöl.</dd>
        <dt>Ulna</dt><dd>Armbågsben; det inre benet i underarmen på lillfingersidan. Sv: armbågsben. Eng: ulna. Av lat. ulna = armbåge, underarm.</dd>
        <dt>Ulnar</dt><dd>På armbågsbenets/lillfingersida av underarmen och handen. Sv: ulnar, lillfingersidan. Eng: ulnar. Av lat. ulna = armbåge, underarm.</dd>
        <dt>Utåtrotation</dt><dd>Rotation av en extremitet bort från kroppens mittlinje. Eng: lateral rotation, external rotation. Motsats: inåtrotation. Av lat. rotare = rotera, av rota = hjul.</dd>
        <dt>Varus</dt><dd>Sned, indragen mot mitten; t.ex. genu varum = hjulbent knä. Sv: varus. Eng: varus. Lekman: hjulbenthet. Av lat. varus = krokbent, böjt inåt.</dd>
        <dt>Vena (ven)</dt><dd>Blodkärl som leder blod tillbaka till hjärtat. Sv: ven. Eng: vein, vena. Lekman: blodåder. Av lat. vena = ven, åder.</dd>
        <dt>Vena cava</dt><dd>Den stora hålvenen; superior leder blod från övre kroppen, inferior från nedre kroppen till höger förmak. Sv: hålven. Eng: vena cava. Av lat. vena (ven) + cavus = ihålig; "den ihåliga venen".</dd>
        <dt>Ventral</dt><dd>Mot framsidan/buken (synonym: anterior). Sv: ventral, framåt. Eng: ventral, anterior. Av lat. venter = mage, buk.</dd>
        <dt>Vertebra</dt><dd>Kotben; ryggraden består av 33–34 kotor. Sv: kota, ryggkota. Eng: vertebra (pl. vertebrae). Lekman: ryggkota. Av lat. vertere = vända; ryggradens leder vänder och roterar.</dd>
        <dt>Viscera</dt><dd>Inälvorna; de inre organen i buk- och bröstkorgen. Sv: inälvor. Eng: viscera, organs. Av lat. viscus (pl. viscera) = inälva, inre organ.</dd>
        <dt>Visceral</dt><dd>Visceral yta; mot de inre organen (jfr parietal), t.ex. visceral pleura täcker lungans yta. Sv: inälvsblad. Eng: visceral. Av lat. viscus = inälva, inre organ.</dd>
      </dl>
